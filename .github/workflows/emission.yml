name: Émission du jour

on:
  schedule:
    - cron: "7,37 * * * *"      # réveil toutes les 30 min ; moteur/planning.py décide (heure et rythme réglables dans l'appli, rattrapage si GitHub saute un réveil)
  workflow_dispatch:             # bouton « Run workflow » pour lancer à la main
    inputs:
      sketch:
        description: "Facultatif : sketch d'essai (ex. tests/sketch_C_clash.json)"
        required: false
        default: ""
      format:
        description: "Type de vidéo : mini (gag éclair), libre (sketch long), actu (JT) ou cycle (3 + 1). Vide = réglage de la régie."
        required: false
        default: ""
      theme:
        description: "Vidéo manuelle (onglet Manuel de la régie) : idée ou script (préfixe SCRIPT::). Hors cycle, jamais publiée automatiquement."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            moteur/planning.py
            moteur/stats.py
            episodes
      - id: p
        env:
          EVENEMENT: ${{ github.event_name }}
          FREQUENCE: ${{ vars.FREQUENCE }}
          HEURE: ${{ vars.HEURE }}
        run: python3 moteur/planning.py

  emission:
    needs: planning
    if: needs.planning.outputs.go == 'true'
    concurrency:                 # les vidéos manuelles ont leur propre file : elles n'annulent jamais une émission en attente
      group: ${{ inputs.theme != '' && format('manuel-{0}', github.run_id) || 'emission' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_MODELE: ${{ vars.ELEVENLABS_MODELE }}
      ELEVENLABS: ${{ vars.ELEVENLABS }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      MODELE_CLAUDE: ${{ vars.MODELE_CLAUDE }}
      NOM_EMISSION: ${{ vars.NOM_EMISSION }}
      PLAN_GAG: ${{ vars.PLAN_GAG }}
      LONGUEUR: ${{ vars.LONGUEUR }}
      SKETCH_TEST: ${{ inputs.sketch }}
      MAX_REECRITURES: ${{ vars.MAX_REECRITURES }}
      SEUIL_QUALITE: ${{ vars.SEUIL_QUALITE }}
      FORMAT: ${{ inputs.format || vars.FORMAT }}
      THEME: ${{ inputs.theme }}
      DECORS: ${{ vars.DECORS }}
      TON: ${{ vars.TON }}
      INFOS_DEMAIN: ${{ vars.INFOS_DEMAIN }}
      PERSONNALITES: ${{ vars.PERSONNALITES }}
      PERSO_JOJO: ${{ vars.PERSO_JOJO }}
      PERSO_KEVIN: ${{ vars.PERSO_KEVIN }}
      PERSO_LILA: ${{ vars.PERSO_LILA }}
      EPISODES: ${{ vars.EPISODES }}
      EPISODES_PAR_SERIE: ${{ vars.EPISODES_PAR_SERIE }}
      ACCROCHE: ${{ vars.ACCROCHE }}
      PUBLIC_TEST: ${{ vars.PUBLIC_TEST }}
      CONTROLE_VIDEO: ${{ vars.CONTROLE_VIDEO }}
      TIKTOK_COMPTE: ${{ vars.TIKTOK_COMPTE }}
      GH_TOKEN: ${{ github.token }}
      EVENEMENT: ${{ github.event_name }}
      FREQUENCE: ${{ vars.FREQUENCE }}
      HEURE: ${{ vars.HEURE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg
        timeout-minutes: 10
        run: |
          if ! (timeout 240 sudo apt-get update -q && timeout 240 sudo apt-get install -y -q ffmpeg); then
            echo "apt indisponible : ffmpeg statique"
            curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Voix de secours (Piper) en cache
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: outils
          key: piper-fr-siwis-v1

      - name: Télécharger Piper
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          mkdir -p outils/voix
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz -C outils
          curl -sSL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-fr-siwis-medium.tar.gz | tar xz -C outils/voix

      - name: Bibliothèques Python
        run: pip install -r requirements.txt

      - name: Déployer les voix (Chatterbox) et le plan gag (Wan 2.2) sur Modal
        if: env.MODAL_TOKEN_ID != ''
        run: |
          modal deploy moteur/voix_modal.py || echo "Deploiement voix echoue, voix de secours"
          modal deploy moteur/video_modal.py || echo "Deploiement Wan echoue, pas de plan gag"
          modal deploy moteur/banque_modal.py || echo "Deploiement banque de voix echoue, chaine de secours"
          modal deploy moteur/decor_modal.py || echo "Deploiement decors echoue, fonds unis"

      - name: Fabriquer l'émission
        id: run
        run: |
          set -o pipefail
          python moteur/principal.py 2>&1 | tee episodes/journal.txt

      - name: Archiver la vidéo dans les Releases du mois
        if: steps.run.outputs.video != ''
        run: |
          TAG="emissions-${{ steps.run.outputs.mois }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Émissions ${{ steps.run.outputs.mois }}" --notes "Vidéos fabriquées par le robot."
          gh release upload "$TAG" "${{ steps.run.outputs.video }}" "${{ steps.run.outputs.legende }}" --clobber

      - name: Publier sur TikTok (seulement si la publication automatique est activée sur le site)
        if: steps.run.outputs.video != '' && vars.PUBLICATION_AUTO == '1' && steps.run.outputs.qualite != 'faible' && inputs.theme == ''
        continue-on-error: true
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/emissions-${{ steps.run.outputs.mois }}/${{ steps.run.outputs.nom }}"
          python moteur/publier.py "${{ steps.run.outputs.video }}" "${{ steps.run.outputs.legende }}" "$URL"

      - name: Enregistrer l'historique et le casting
        if: always()
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes voix
          git commit -m "Émission : ${{ steps.run.outputs.titre }}" || echo "rien à enregistrer"
          python moteur/fusion.py      # plusieurs fabrications en parallèle : l'historique est fusionné, jamais écrasé

      - name: Construire le site de secours
        if: always()
        run: python moteur/site.py

      - name: Préparer GitHub Pages
        if: always()
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        if: always()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mettre en ligne le site
        id: pages
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
