name: Émission du jour
# le nom dit aussi s'il s'agit d'un créneau du planning (sketch ou son TikTok) : sert à éviter deux fabrications pour le même créneau
run-name: ${{ startsWith(inputs.chaine, 'suite:') && 'Reprise d''une fabrication en pause' || ((github.event_name == 'schedule' || inputs.auto == '1') && (inputs.filiere == 'tiktok' && 'Créneau son TikTok' || 'Émission du jour (créneau)')) || (inputs.filiere == 'tiktok' && (inputs.chaine != '' && format('Son TikTok ({0})', inputs.chaine) || 'Son TikTok') || 'Émission du jour') }}

on:
  schedule:
    - cron: "7,37 * * * *"      # réveil toutes les 30 min ; moteur/planning.py décide (heure et rythme réglables dans l'appli, rattrapage si GitHub saute un réveil)
  workflow_dispatch:             # bouton « Run workflow » pour lancer à la main
    inputs:
      sketch:
        description: "Facultatif : sketch d'essai (ex. tests/sketch_C_clash.json)"
        required: false
        default: ""
      format:
        description: "Type de vidéo : mini (gag éclair), libre (sketch long) ou cycle (3 + 1). Vide = réglage de la régie."
        required: false
        default: ""
      refaire:
        description: "Bouton Refaire de la régie : fichier.mp4|texte (ou voix, decors)"
        required: false
        default: ""
      auto:
        description: "1 = lancement du réveil de secours (compte comme une vidéo automatique)"
        required: false
        default: ""
      rendu:
        description: "realiste = vidéo réaliste filmée par l'IA (Veo 3.1 via ElevenLabs, coûte des crédits) ; vide = dessin animé ; essai_pause = essai de la mise en pause / reprise"
        required: false
        default: ""
      serie:
        description: "1 = série d'un seul jet (régie) : la saison est planifiée puis tous les épisodes s'enchaînent"
        required: false
        default: ""
      theme:
        description: "Vidéo manuelle (onglet Manuel de la régie) : idée ou script (préfixe SCRIPT::). Hors cycle, jamais publiée automatiquement."
        required: false
        default: ""
      filiere:
        description: "tiktok = filière « Sons TikTok » (planning et vidéos à part des sketchs) : une vidéo au hasard des profils"
        required: false
        default: ""
      apercu:
        description: "1 = aperçu rapide : seulement les 10 premières secondes, 24 images/s (pour juger le style)"
        required: false
        default: ""
      chaine:
        description: "Vidéos TikTok à la chaîne : « 1/3 » = 1re de 3 ; chaque vidéo finie lance la suivante (bouton du site)"
        required: false
        default: ""
      eviter:
        description: "Interne (chaîne) : sons TikTok encore en fabrication, à ne pas reprendre"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  statuses: write              # avancement de la fabrication, lu par le site (barre de progression)
  checks: write                # (secours de la barre de progression)

jobs:
  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            moteur/planning.py
            moteur/stats.py
            episodes
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}                 # heure de la demande et doublons du même créneau (moteur/planning.py)
          EVENEMENT: ${{ inputs.auto == '1' && 'schedule' || github.event_name }}
          FILIERE: ${{ inputs.filiere }}
          FREQUENCE: ${{ inputs.filiere == 'tiktok' && (vars.FREQUENCE_TIKTOK || '0') || vars.FREQUENCE }}
          HEURE: ${{ inputs.filiere == 'tiktok' && (vars.HEURE_TIKTOK || '14:00') || vars.HEURE }}
          BUDGET_MOIS: ${{ vars.BUDGET_MOIS }}
          ESSAIS_MAX: ${{ vars.ESSAIS_MAX }}
        run: python3 moteur/planning.py

  file:                          # file d'attente : une seule vidéo fabriquée à la fois, dans l'ordre des demandes (moteur/file_attente.py)
    needs: planning
    if: needs.planning.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            moteur/file_attente.py
            moteur/progression.py
            moteur/quota.py
      - name: Attendre que les vidéos lancées avant soient finies
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE_VIDEO: ${{ (inputs.filiere == 'tiktok' || startsWith(inputs.theme, 'TIKTOK::')) && 'tiktok' || 'sketch' }}
          CHAINE: ${{ inputs.chaine }}
          PREPA_PARALLELE: ${{ vars.PREPA_PARALLELE || '1' }}
        run: python3 moteur/file_attente.py

  emission:
    needs: [planning, file]
    if: needs.planning.outputs.go == 'true'
    concurrency:                 # les vidéos manuelles ont leur propre file : elles n'annulent jamais une émission en attente
      group: ${{ (inputs.theme != '' || inputs.refaire != '' || inputs.chaine != '') && format('manuel-{0}', github.run_id) || (inputs.serie != '' && 'serie') || (inputs.filiere == 'tiktok' && 'sons-tiktok') || 'emission' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180          # limite de GitHub pour une fabrication (la 2e version du jury s'arrête 25 min avant : moteur/principal.limite_job)
    env:
      LIMITE_JOB_MIN: "180"                             # même valeur que timeout-minutes ci-dessus
      PYTHONHASHSEED: "0"                               # dessin identique à l'image près sur toutes les machines (dessin partagé)
      ENTREES: ${{ toJSON(inputs) }}                    # réglages de lancement (repris tels quels si la fabrication est mise en pause)
      CHAINE: ${{ inputs.chaine }}                      # vidéos TikTok à la chaîne : « 2/3 » affiché sur la barre du site
      PREPA_PARALLELE: ${{ vars.PREPA_PARALLELE || '1' }}  # chaîne : la vidéo suivante prépare son écoute pendant que celle-ci se dessine
      EVITER: ${{ inputs.eviter }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}                 # facultatif : clé Hugging Face gratuite → séparation des voix par pyannote
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}         # facultatif : clé Groq gratuite → transcription Whisper en quelques secondes
      ELEVENLABS_MODELE: ${{ vars.ELEVENLABS_MODELE }}
      ELEVENLABS: ${{ vars.ELEVENLABS }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      MODELE_CLAUDE: ${{ vars.MODELE_CLAUDE }}
      NOM_EMISSION: ${{ vars.NOM_EMISSION }}
      LONGUEUR: ${{ vars.LONGUEUR }}
      SKETCH_TEST: ${{ inputs.sketch }}
      MAX_REECRITURES: ${{ vars.MAX_REECRITURES }}
      SEUIL_QUALITE: ${{ vars.SEUIL_QUALITE }}
      FORMAT: ${{ inputs.format || vars.FORMAT }}
      THEME: ${{ inputs.theme }}
      SERIE_LOT: ${{ inputs.serie }}
      RENDU: ${{ inputs.rendu }}
      QUALITE_MIN: ${{ vars.QUALITE_MIN }}
      SUJETS_MAX: ${{ vars.SUJETS_MAX }}
      REALISTE_AUTO: ${{ vars.REALISTE_AUTO }}
      REALISTE_MODELE: ${{ vars.REALISTE_MODELE }}
      REALISTE_RESOLUTION: ${{ vars.REALISTE_RESOLUTION }}
      PRONONCIATION: ${{ vars.PRONONCIATION }}
      VOIX_PERSOS: ${{ vars.VOIX_PERSOS }}
      REFAIRE: ${{ inputs.refaire }}
      SEUIL_PUBLICATION: ${{ vars.SEUIL_PUBLICATION }}
      TENDANCES: ${{ vars.TENDANCES }}
      DECORS: ${{ vars.DECORS }}
      RENDU_DETAILLE: ${{ vars.RENDU_DETAILLE }}
      PERSONNAGES: ${{ vars.PERSONNAGES }}
      MONTAGE: ${{ vars.MONTAGE }}
      TON: ${{ vars.TON }}
      INFOS_DEMAIN: ${{ vars.INFOS_DEMAIN }}
      PERSONNALITES: ${{ vars.PERSONNALITES }}
      PERSO_JOJO: ${{ vars.PERSO_JOJO }}
      PERSO_KEVIN: ${{ vars.PERSO_KEVIN }}
      PERSO_LILA: ${{ vars.PERSO_LILA }}
      EPISODES: ${{ vars.EPISODES }}
      EPISODES_PAR_SERIE: ${{ vars.EPISODES_PAR_SERIE }}
      ACCROCHE: ${{ vars.ACCROCHE }}
      PUBLIC_TEST: ${{ vars.PUBLIC_TEST }}
      CONTROLE_VIDEO: ${{ vars.CONTROLE_VIDEO }}
      TIKTOK_COMPTE: ${{ vars.TIKTOK_COMPTE }}
      PROFILS_TIKTOK: ${{ vars.PROFILS_TIKTOK }}
      PUBLI_FILE: ${{ vars.PUBLI_FILE }}
      CONFIANCE_MIN: ${{ vars.CONFIANCE_MIN }}
      DEUXIEME_CHANCE: ${{ vars.DEUXIEME_CHANCE }}
      GH_TOKEN: ${{ github.token }}
      EVENEMENT: ${{ inputs.auto == '1' && 'schedule' || github.event_name }}
      FILIERE: ${{ inputs.filiere }}
      FREQUENCE: ${{ inputs.filiere == 'tiktok' && (vars.FREQUENCE_TIKTOK || '0') || vars.FREQUENCE }}
      HEURE: ${{ inputs.filiere == 'tiktok' && (vars.HEURE_TIKTOK || '14:00') || vars.HEURE }}
      BUDGET_MOIS: ${{ vars.BUDGET_MOIS }}
      ESSAIS_MAX: ${{ vars.ESSAIS_MAX }}
      ETAPES_ECO: ${{ vars.ETAPES_ECO }}
      MODE_ECO: ${{ vars.MODE_ECO }}
      JURY: ${{ vars.JURY }}
      JURY_TOURS: ${{ vars.JURY_TOURS }}
      SEUIL_JURY: ${{ vars.SEUIL_JURY }}
      IPS: ${{ inputs.apercu == '1' && '24' || vars.IPS || '60' }}
      APERCU_RAPIDE: ${{ inputs.apercu }}
      EXAGERE: ${{ vars.EXAGERE }}
      CRF: ${{ vars.CRF }}
      VAPID_PRIVEE: ${{ vars.VAPID_PRIVEE }}
      VAPID_PUBLIQUE: ${{ vars.VAPID_PUBLIQUE }}
      PUSH_ABONNEMENTS: ${{ vars.PUSH_ABONNEMENTS }}
    steps:
      - uses: actions/checkout@v7

      - name: Noter l'heure de départ (limite de temps de GitHub)
        run: echo "DEBUT_JOB=$(date +%s)" >> "$GITHUB_ENV"

      - name: Vérifier son tour (fabrication relancée par le garde)
        timeout-minutes: 100
        continue-on-error: true      # attente trop longue : on fabrique quand même plutôt que de perdre la vidéo
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE_VIDEO: ${{ (inputs.filiere == 'tiktok' || startsWith(inputs.theme, 'TIKTOK::')) && 'tiktok' || 'sketch' }}
        run: python3 moteur/file_attente.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg
        timeout-minutes: 10
        run: |
          if ! (timeout 240 sudo apt-get update -q && timeout 240 sudo apt-get install -y -q ffmpeg); then
            echo "apt indisponible : ffmpeg statique"
            curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Voix de secours (Piper) en cache
        id: cache-piper
        uses: actions/cache@v6
        with:
          path: outils
          key: piper-fr-4voix-v2

      - name: Télécharger Piper
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          mkdir -p outils/voix
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz -C outils
          curl -sSL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-fr-siwis-medium.tar.gz | tar xz -C outils/voix
          for v in tom/medium/fr_FR-tom-medium gilles/low/fr_FR-gilles-low upmc/medium/fr_FR-upmc-medium; do   # une voix gratuite par personnage
            for e in onnx onnx.json; do curl -sSL -o "outils/voix/$(basename $v).$e" "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/$v.$e" || true; done
          done

      - name: Bibliothèques Python
        run: pip install -r requirements.txt -c contraintes.txt      # versions qui marchent (contraintes.txt)

      - name: Modèles de reconnaissance vocale et d'empreinte en cache (Whisper large-v3-turbo, ECAPA)
        if: startsWith(inputs.theme, 'TIKTOK::') || inputs.filiere == 'tiktok' || contains(inputs.refaire, '|qui|')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            outils/emotion_voix
            outils/pose_landmarker_lite.task
          key: hf-ecoute-v2
          restore-keys: hf-whisper-turbo-v1

      - name: Lecteur TikTok (vidéo depuis une bande son)
        if: startsWith(inputs.theme, 'TIKTOK::') || inputs.filiere == 'tiktok' || contains(inputs.refaire, '|qui|')
        run: |
          pip install -q -U "yt-dlp[default,curl-cffi]" faster-whisper -c contraintes.txt   # Whisper gratuit : repli si ElevenLabs et Modal manquent de crédit
          (pip install -q torch torchaudio -c contraintes.txt --index-url https://download.pytorch.org/whl/cpu && pip install -q speechbrain -c contraintes.txt) || echo "empreinte vocale ECAPA indisponible : timbre MFCC"
          if [ -n "$HF_TOKEN" ]; then pip install -q pyannote.audio -c contraintes.txt || echo "pyannote indisponible : empreinte ECAPA seule"; fi   # séparation des voix (clé Hugging Face gratuite)
          # écoute gratuite (moteur/ecoute.py, postures.py) : Demucs, calage des mots, émotion de la voix, bruits (CLAP), postures (MediaPipe)
          pip install -q demucs transformers -c contraintes.txt || echo "Demucs / transformers indisponibles : sans eux"
          pip install -q --no-deps mediapipe absl-py flatbuffers sounddevice -c contraintes.txt && pip install -q matplotlib -c contraintes.txt || echo "MediaPipe indisponible : postures de l'original non lues"
          sudo apt-get install -y -q libegl1 libgles2 >/dev/null 2>&1 || true

      - name: Déployer les voix (Chatterbox), la banque de voix et les décors sur Modal
        if: env.MODAL_TOKEN_ID != ''
        run: |
          modal deploy moteur/voix_modal.py || echo "Deploiement voix echoue, voix de secours"
          modal deploy moteur/banque_modal.py || echo "Deploiement banque de voix echoue, chaine de secours"
          modal deploy moteur/decor_modal.py || echo "Deploiement decors echoue, fonds unis"
          modal deploy moteur/ecoute_modal.py || echo "Deploiement ecoute (NeMo, Florence-2) echoue : pyannote / ECAPA et IA seules"

      - name: Fabriquer l'émission
        id: run
        run: |
          set -o pipefail
          python moteur/principal.py 2>&1 | tee episodes/journal.txt

      - name: Archiver la vidéo dans les Releases du mois
        if: steps.run.outputs.video != ''
        run: |
          TAG="emissions-${{ steps.run.outputs.mois }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Émissions ${{ steps.run.outputs.mois }}" --notes "Vidéos fabriquées par le robot."
          V="${{ steps.run.outputs.video }}"; B="${V%.mp4}"; F=("$V" "${{ steps.run.outputs.legende }}")
          [ -f "${B}_web.mp4" ] && F+=("${B}_web.mp4"); [ -f "$B.jpg" ] && F+=("$B.jpg")   # version légère + couverture : lues par l'appli
          gh release upload "$TAG" "${F[@]}" --clobber

      - name: Prévenir le téléphone (vidéo prête)
        if: steps.run.outputs.video != ''
        continue-on-error: true
        env:
          TITRE_VIDEO: ${{ steps.run.outputs.titre }}
          NOTE: ${{ steps.run.outputs.note }}
        run: python moteur/alerte.py "🎬 Nouvelle vidéo prête" "« $TITRE_VIDEO » — note $NOTE/100. À vérifier dans l'appli."

      - name: Prévenir le téléphone (échec)
        if: failure()
        continue-on-error: true
        run: python moteur/alerte.py "⚠️ Échec de fabrication" "$(grep -v '^  image' episodes/journal.txt 2>/dev/null | tail -n 3 | cut -c1-250)"

      - name: Publier sur TikTok (seulement si la publication automatique est activée sur le site)
        if: steps.run.outputs.video != '' && vars.PUBLICATION_AUTO == '1' && steps.run.outputs.qualite != 'faible' && inputs.theme == '' && inputs.refaire == '' && inputs.serie == '' && inputs.apercu != '1'
        continue-on-error: true
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/emissions-${{ steps.run.outputs.mois }}/${{ steps.run.outputs.nom }}"
          python moteur/publier.py "${{ steps.run.outputs.video }}" "${{ steps.run.outputs.legende }}" "$URL"

      - name: Enregistrer l'historique et le casting
        if: always()
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes voix decors sons_eleven
          git commit -m "Émission : ${{ steps.run.outputs.titre }}" || echo "rien à enregistrer"
          python moteur/fusion.py      # plusieurs fabrications en parallèle : l'historique est fusionné, jamais écrasé

      - name: Deuxième chance (vidéo peu sûre refaite une fois, la plus sûre des deux est gardée)
        if: always()
        run: |
          if [ -s sortie/.perdante ]; then
            F="$(cat sortie/.perdante)"
            FICHIER="$F" python moteur/supprimer.py
            git add episodes; git commit -m "Deuxième chance : $F retirée (moins sûre)" || echo "rien à enregistrer"
            FICHIER="$F" REJOUER="python moteur/supprimer.py" MESSAGE="Deuxième chance" python moteur/fusion.py
          fi
          if [ -s sortie/.deuxieme_chance ]; then
            gh workflow run emission.yml --ref main -f filiere=tiktok -f theme="$(cat sortie/.deuxieme_chance)" && echo "2e chance lancée"
          fi

      - name: Mettre le site à jour (une seule file d'attente pour tout le robot, aucune vidéo oubliée)
        if: always()
        run: |
          gh workflow run site.yml --ref main || echo "Mise à jour du site impossible à lancer : relancez « Mettre à jour le site »"

      - name: Lancer la vidéo suivante de la chaîne
        if: ${{ !cancelled() && inputs.chaine != '' && steps.run.outputs.pause != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHAINE: ${{ steps.run.outputs.chaine || inputs.chaine }}
        run: |
          case "$CHAINE" in suite:*) CHAINE="${CHAINE#*|}";; esac   # reprise d'une vidéo en pause : la chaîne d'origine
          # « 2/3 » : 2e vidéo sur 3 ; même si celle-ci a échoué (aucun son utilisable…), la suivante est lancée
          K="${CHAINE%%/*}"; N="${CHAINE##*/}"
          if ! [[ "$K" =~ ^[0-9]+$ && "$N" =~ ^[0-9]+$ ]] || [ "$K" -ge "$N" ]; then echo "Chaîne terminée ($CHAINE)."; exit 0; fi
          if [ -f sortie/.suivante_lancee ]; then echo "Vidéo suivante déjà lancée (préparation en parallèle)."; exit 0; fi
          SUIV="Son TikTok ($((K + 1))/$N)"                             # déjà lancée (par une reprise, une 1re tentative…) ?
          if gh run list -w emission.yml -L 40 --json displayTitle,createdAt -q "[.[] | select(.displayTitle==\"$SUIV\")] | length" | grep -qv '^0$'; then echo "$SUIV déjà lancée."; exit 0; fi
          if [ "${{ github.run_attempt }}" != "1" ]; then              # fabrication relancée par le garde : la suivante était-elle déjà lancée ?
            DEJA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/attempts/1/jobs" -q '[.jobs[].steps[]? | select(.name=="Lancer la vidéo suivante de la chaîne" and .conclusion=="success")] | length' || echo 0)
            if [ "$DEJA" != "0" ]; then echo "Vidéo suivante déjà lancée par la 1re tentative."; exit 0; fi
          fi
          gh workflow run emission.yml --ref main -f filiere=tiktok -f chaine="$((K + 1))/$N" && echo "Vidéo $((K + 1))/$N de la chaîne lancée."
