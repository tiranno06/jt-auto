name: Émission du jour

on:
  schedule:
    - cron: "7,37 * * * *"      # réveil toutes les 30 min ; moteur/planning.py décide (heure et rythme réglables dans l'appli, rattrapage si GitHub saute un réveil)
  workflow_dispatch:             # bouton « Run workflow » pour lancer à la main
    inputs:
      sketch:
        description: "Facultatif : sketch d'essai (ex. tests/sketch_C_clash.json)"
        required: false
        default: ""
      format:
        description: "Type de vidéo : mini (gag éclair), libre (sketch long) ou cycle (3 + 1). Vide = réglage de la régie."
        required: false
        default: ""
      refaire:
        description: "Bouton Refaire de la régie : fichier.mp4|texte (ou voix, decors)"
        required: false
        default: ""
      auto:
        description: "1 = lancement du réveil de secours (compte comme une vidéo automatique)"
        required: false
        default: ""
      rendu:
        description: "realiste = vidéo réaliste filmée par l'IA (Veo 3.1 via ElevenLabs, coûte des crédits) ; vide = dessin animé"
        required: false
        default: ""
      serie:
        description: "1 = série d'un seul jet (régie) : la saison est planifiée puis tous les épisodes s'enchaînent"
        required: false
        default: ""
      theme:
        description: "Vidéo manuelle (onglet Manuel de la régie) : idée ou script (préfixe SCRIPT::). Hors cycle, jamais publiée automatiquement."
        required: false
        default: ""
      filiere:
        description: "tiktok = filière « Sons TikTok » (planning et vidéos à part des sketchs) : une vidéo au hasard des profils"
        required: false
        default: ""
      apercu:
        description: "1 = aperçu rapide : seulement les 10 premières secondes, 24 images/s (pour juger le style)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  statuses: write              # avancement de la fabrication, lu par le site (barre de progression)

jobs:
  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            moteur/planning.py
            moteur/stats.py
            episodes
      - id: p
        env:
          EVENEMENT: ${{ inputs.auto == '1' && 'schedule' || github.event_name }}
          FILIERE: ${{ inputs.filiere }}
          FREQUENCE: ${{ inputs.filiere == 'tiktok' && (vars.FREQUENCE_TIKTOK || '0') || vars.FREQUENCE }}
          HEURE: ${{ inputs.filiere == 'tiktok' && (vars.HEURE_TIKTOK || '14:00') || vars.HEURE }}
          BUDGET_MOIS: ${{ vars.BUDGET_MOIS }}
          ESSAIS_MAX: ${{ vars.ESSAIS_MAX }}
        run: python3 moteur/planning.py

  emission:
    needs: planning
    if: needs.planning.outputs.go == 'true'
    concurrency:                 # les vidéos manuelles ont leur propre file : elles n'annulent jamais une émission en attente
      group: ${{ (inputs.theme != '' || inputs.refaire != '') && format('manuel-{0}', github.run_id) || (inputs.serie != '' && 'serie') || (inputs.filiere == 'tiktok' && 'sons-tiktok') || 'emission' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_MODELE: ${{ vars.ELEVENLABS_MODELE }}
      ELEVENLABS: ${{ vars.ELEVENLABS }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      MODELE_CLAUDE: ${{ vars.MODELE_CLAUDE }}
      NOM_EMISSION: ${{ vars.NOM_EMISSION }}
      LONGUEUR: ${{ vars.LONGUEUR }}
      SKETCH_TEST: ${{ inputs.sketch }}
      MAX_REECRITURES: ${{ vars.MAX_REECRITURES }}
      SEUIL_QUALITE: ${{ vars.SEUIL_QUALITE }}
      FORMAT: ${{ inputs.format || vars.FORMAT }}
      THEME: ${{ inputs.theme }}
      SERIE_LOT: ${{ inputs.serie }}
      RENDU: ${{ inputs.rendu }}
      QUALITE_MIN: ${{ vars.QUALITE_MIN }}
      SUJETS_MAX: ${{ vars.SUJETS_MAX }}
      REALISTE_AUTO: ${{ vars.REALISTE_AUTO }}
      REALISTE_MODELE: ${{ vars.REALISTE_MODELE }}
      REALISTE_RESOLUTION: ${{ vars.REALISTE_RESOLUTION }}
      PRONONCIATION: ${{ vars.PRONONCIATION }}
      VOIX_PERSOS: ${{ vars.VOIX_PERSOS }}
      REFAIRE: ${{ inputs.refaire }}
      SEUIL_PUBLICATION: ${{ vars.SEUIL_PUBLICATION }}
      TENDANCES: ${{ vars.TENDANCES }}
      DECORS: ${{ vars.DECORS }}
      RENDU_DETAILLE: ${{ vars.RENDU_DETAILLE }}
      PERSONNAGES: ${{ vars.PERSONNAGES }}
      MONTAGE: ${{ vars.MONTAGE }}
      TON: ${{ vars.TON }}
      INFOS_DEMAIN: ${{ vars.INFOS_DEMAIN }}
      PERSONNALITES: ${{ vars.PERSONNALITES }}
      PERSO_JOJO: ${{ vars.PERSO_JOJO }}
      PERSO_KEVIN: ${{ vars.PERSO_KEVIN }}
      PERSO_LILA: ${{ vars.PERSO_LILA }}
      EPISODES: ${{ vars.EPISODES }}
      EPISODES_PAR_SERIE: ${{ vars.EPISODES_PAR_SERIE }}
      ACCROCHE: ${{ vars.ACCROCHE }}
      PUBLIC_TEST: ${{ vars.PUBLIC_TEST }}
      CONTROLE_VIDEO: ${{ vars.CONTROLE_VIDEO }}
      TIKTOK_COMPTE: ${{ vars.TIKTOK_COMPTE }}
      PROFILS_TIKTOK: ${{ vars.PROFILS_TIKTOK }}
      GH_TOKEN: ${{ github.token }}
      EVENEMENT: ${{ inputs.auto == '1' && 'schedule' || github.event_name }}
      FILIERE: ${{ inputs.filiere }}
      FREQUENCE: ${{ inputs.filiere == 'tiktok' && (vars.FREQUENCE_TIKTOK || '0') || vars.FREQUENCE }}
      HEURE: ${{ inputs.filiere == 'tiktok' && (vars.HEURE_TIKTOK || '14:00') || vars.HEURE }}
      BUDGET_MOIS: ${{ vars.BUDGET_MOIS }}
      ESSAIS_MAX: ${{ vars.ESSAIS_MAX }}
      ETAPES_ECO: ${{ vars.ETAPES_ECO }}
      MODE_ECO: ${{ vars.MODE_ECO }}
      JURY: ${{ vars.JURY }}
      JURY_TOURS: ${{ vars.JURY_TOURS }}
      SEUIL_JURY: ${{ vars.SEUIL_JURY }}
      IPS: ${{ inputs.apercu == '1' && '24' || vars.IPS || '60' }}
      APERCU_RAPIDE: ${{ inputs.apercu }}
      EXAGERE: ${{ vars.EXAGERE }}
      CRF: ${{ vars.CRF }}
      VAPID_PRIVEE: ${{ vars.VAPID_PRIVEE }}
      VAPID_PUBLIQUE: ${{ vars.VAPID_PUBLIQUE }}
      PUSH_ABONNEMENTS: ${{ vars.PUSH_ABONNEMENTS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg
        timeout-minutes: 10
        run: |
          if ! (timeout 240 sudo apt-get update -q && timeout 240 sudo apt-get install -y -q ffmpeg); then
            echo "apt indisponible : ffmpeg statique"
            curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Voix de secours (Piper) en cache
        id: cache-piper
        uses: actions/cache@v6
        with:
          path: outils
          key: piper-fr-4voix-v2

      - name: Télécharger Piper
        if: steps.cache-piper.outputs.cache-hit != 'true'
        run: |
          mkdir -p outils/voix
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz -C outils
          curl -sSL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-fr-siwis-medium.tar.gz | tar xz -C outils/voix
          for v in tom/medium/fr_FR-tom-medium gilles/low/fr_FR-gilles-low upmc/medium/fr_FR-upmc-medium; do   # une voix gratuite par personnage
            for e in onnx onnx.json; do curl -sSL -o "outils/voix/$(basename $v).$e" "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/$v.$e" || true; done
          done

      - name: Bibliothèques Python
        run: pip install -r requirements.txt

      - name: Lecteur TikTok (vidéo depuis une bande son)
        if: startsWith(inputs.theme, 'TIKTOK::') || inputs.filiere == 'tiktok'
        run: |
          pip install -q -U "yt-dlp[default,curl-cffi]" faster-whisper   # Whisper gratuit : repli si ElevenLabs et Modal manquent de crédit
          (pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q speechbrain) || echo "empreinte vocale ECAPA indisponible : timbre MFCC"

      - name: Déployer les voix (Chatterbox), la banque de voix et les décors sur Modal
        if: env.MODAL_TOKEN_ID != ''
        run: |
          modal deploy moteur/voix_modal.py || echo "Deploiement voix echoue, voix de secours"
          modal deploy moteur/banque_modal.py || echo "Deploiement banque de voix echoue, chaine de secours"
          modal deploy moteur/decor_modal.py || echo "Deploiement decors echoue, fonds unis"

      - name: Fabriquer l'émission
        id: run
        run: |
          set -o pipefail
          python moteur/principal.py 2>&1 | tee episodes/journal.txt

      - name: Archiver la vidéo dans les Releases du mois
        if: steps.run.outputs.video != ''
        run: |
          TAG="emissions-${{ steps.run.outputs.mois }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Émissions ${{ steps.run.outputs.mois }}" --notes "Vidéos fabriquées par le robot."
          gh release upload "$TAG" "${{ steps.run.outputs.video }}" "${{ steps.run.outputs.legende }}" --clobber

      - name: Prévenir le téléphone (vidéo prête)
        if: steps.run.outputs.video != ''
        continue-on-error: true
        env:
          TITRE_VIDEO: ${{ steps.run.outputs.titre }}
          NOTE: ${{ steps.run.outputs.note }}
        run: python moteur/alerte.py "🎬 Nouvelle vidéo prête" "« $TITRE_VIDEO » — note $NOTE/100. À vérifier dans l'appli."

      - name: Prévenir le téléphone (échec)
        if: failure()
        continue-on-error: true
        run: python moteur/alerte.py "⚠️ Échec de fabrication" "$(grep -v '^  image' episodes/journal.txt 2>/dev/null | tail -n 3 | cut -c1-250)"

      - name: Publier sur TikTok (seulement si la publication automatique est activée sur le site)
        if: steps.run.outputs.video != '' && vars.PUBLICATION_AUTO == '1' && steps.run.outputs.qualite != 'faible' && inputs.theme == '' && inputs.refaire == '' && inputs.serie == '' && inputs.apercu != '1'
        continue-on-error: true
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/emissions-${{ steps.run.outputs.mois }}/${{ steps.run.outputs.nom }}"
          python moteur/publier.py "${{ steps.run.outputs.video }}" "${{ steps.run.outputs.legende }}" "$URL"

      - name: Enregistrer l'historique et le casting
        if: always()
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes voix decors sons_eleven
          git commit -m "Émission : ${{ steps.run.outputs.titre }}" || echo "rien à enregistrer"
          python moteur/fusion.py      # plusieurs fabrications en parallèle : l'historique est fusionné, jamais écrasé

      - name: Mettre le site à jour (une seule file d'attente pour tout le robot, aucune vidéo oubliée)
        if: always()
        run: |
          gh workflow run site.yml --ref main || echo "Mise à jour du site impossible à lancer : relancez « Mettre à jour le site »"
