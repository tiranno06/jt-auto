name: Essai ElevenLabs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tester la clé ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p essai_elevenlabs episodes
          python moteur/essai_elevenlabs.py 2>&1 | tee episodes/essai_elevenlabs.txt
      - name: Publier les extraits audio et le rapport
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view essais >/dev/null 2>&1 || gh release create essais --title "Essais" --notes "Extraits de test."
          ls essai_elevenlabs/*.mp3 >/dev/null 2>&1 && gh release upload essais essai_elevenlabs/*.mp3 --clobber || true
          git config user.name robot-jt; git config user.email robot-jt@users.noreply.github.com
          git add episodes/essai_elevenlabs.txt && git commit -m "Essai ElevenLabs : rapport" && git pull --rebase -q && git push || true
