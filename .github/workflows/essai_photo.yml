name: Essai décors photo (maquette, une seule fois)

on:
  push:
    branches: [claude/contenu-tiktok-automatise-k1o5uj]
    paths: ["maquettes/photo/photo_modal.py"]

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install -q modal -c contraintes.txt
          modal run maquettes/photo/photo_modal.py
          git config user.name "robot-jt"; git config user.email "robot-jt@users.noreply.github.com"
          git add maquettes/photo/decors && git commit -m "Essai décors photo : images" && git push
