name: Réveil de secours

# GitHub saute parfois les réveils planifiés d'un workflow. Ce garde, sur d'autres minutes, vérifie le planning :
# si une vidéo automatique est due et qu'aucune fabrication n'est en cours, il lance lui-même le robot.
on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read                 # messages des étapes coupées (annulée par GitHub ou par l'auteur ?)

jobs:
  garde:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            moteur/planning.py
            moteur/stats.py
            moteur/relance.py
            moteur/dessin_partage.py
            moteur/publication_auto.py
            episodes
      - id: p
        env:
          EVENEMENT: schedule
          FREQUENCE: ${{ vars.FREQUENCE }}
          HEURE: ${{ vars.HEURE }}
          BUDGET_MOIS: ${{ vars.BUDGET_MOIS }}
          ESSAIS_MAX: ${{ vars.ESSAIS_MAX }}
        run: python3 moteur/planning.py
      - name: Lancer le robot si le réveil normal a été sauté
        if: steps.p.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EN_COURS=$(gh run list -R "$GITHUB_REPOSITORY" -w emission.yml --json status -q '[.[]|select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")]|length')
          if [ "$EN_COURS" = "0" ]; then
            gh workflow run emission.yml -R "$GITHUB_REPOSITORY" -f auto=1 && echo "Réveil sauté : robot relancé par le garde."
          else
            echo "Une fabrication est déjà en cours : rien à faire."
          fi
      - id: tk
        name: Planning des sons TikTok (filière à part des sketchs)
        env:
          EVENEMENT: schedule
          FILIERE: tiktok
          FREQUENCE: ${{ vars.FREQUENCE_TIKTOK || '0' }}
          HEURE: ${{ vars.HEURE_TIKTOK || '14:00' }}
          ESSAIS_MAX: ${{ vars.ESSAIS_MAX }}
        run: python3 moteur/planning.py
      - name: Lancer une vidéo sur un son TikTok (créneau du planning TikTok)
        if: steps.tk.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # file d'attente « sons-tiktok » : un 2e lancement attend le 1er puis s'arrête (créneau déjà traité)
          gh workflow run emission.yml -R "$GITHUB_REPOSITORY" -f auto=1 -f filiere=tiktok && echo "Créneau TikTok : vidéo lancée."
      - name: Ménage des vidéos d'essai (une fois par jour, vers 4 h du matin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # aperçus 10 s, sketchs d'essai, essais de pause : effacés au bout de 3 jours (moteur/supprimer.py → menage_essais)
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ]; then
            gh workflow run supprimer.yml -R "$GITHUB_REPOSITORY" -f fichier=ESSAIS && echo "Ménage des essais lancé."
          fi

      - name: Publication automatique (une vidéo cochée par jour, à l'heure choisie dans l'onglet TikTok)
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLI_AUTO: ${{ vars.PUBLI_AUTO }}
          PUBLI_HEURE: ${{ vars.PUBLI_HEURE }}
          PUBLI_HEURE_AUTO: ${{ vars.PUBLI_HEURE_AUTO }}
          PUBLI_DEUX: ${{ vars.PUBLI_DEUX }}
          PUBLI_HEURE2: ${{ vars.PUBLI_HEURE2 }}
          PUBLI_FILE: ${{ vars.PUBLI_FILE }}
        run: python3 moteur/publication_auto.py || true

      - name: Relancer une fabrication coupée par GitHub (machine arrêtée en pleine vidéo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # une seule relance par fabrication des 6 dernières heures : en échec, ou annulée PAR GITHUB (délai dépassé, machine
          # coupée) ; jamais une fabrication annulée par l'auteur (moteur/relance.py)
          python3 moteur/relance.py || true
