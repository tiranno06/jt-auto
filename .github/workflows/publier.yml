name: Publier une vidéo

# Lancé par le bouton « Publier sur TikTok » du site (ou à la main : Actions → Publier une vidéo → Run workflow).
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Nom de la vidéo (ex. 2026-10-09_emission.mp4)"
        required: true
      forcer:
        description: "Republier même si elle est déjà publiée"
        required: false
        default: "non"
      quand:
        description: "Facultatif : date et heure de publication, heure de Paris (ex. 2026-10-12T18:30). Vide = tout de suite."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  publier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      NOM_EMISSION: ${{ vars.NOM_EMISSION }}
      GH_TOKEN: ${{ github.token }}
      FICHIER: ${{ inputs.fichier }}
      FORCER: ${{ inputs.forcer }}
      QUAND: ${{ inputs.quand }}
      PUBLIER_YOUTUBE: ${{ vars.PUBLIER_YOUTUBE }}
      PUBLIER_INSTAGRAM: ${{ vars.PUBLIER_INSTAGRAM }}
      VAPID_PRIVEE: ${{ vars.VAPID_PRIVEE }}
      VAPID_PUBLIQUE: ${{ vars.VAPID_PUBLIQUE }}
      PUSH_ABONNEMENTS: ${{ vars.PUSH_ABONNEMENTS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer ffmpeg
        timeout-minutes: 10
        run: |
          if ! (timeout 240 sudo apt-get update -q && timeout 240 sudo apt-get install -y -q ffmpeg); then
            echo "apt indisponible : ffmpeg statique"
            curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1

      - name: Retrouver la vidéo
        id: video
        run: python moteur/publier.py --preparer

      - name: Publier sur TikTok
        if: steps.video.outputs.video != ''
        run: python moteur/publier.py "${{ steps.video.outputs.video }}" "${{ steps.video.outputs.legende }}" "${{ steps.video.outputs.url }}"

      - name: Prévenir le téléphone
        if: always() && steps.video.outputs.video != ''
        continue-on-error: true
        run: |
          pip install -q cryptography
          if [ "${{ job.status }}" = "success" ]; then
            if [ -n "$QUAND" ]; then M="programmée pour le $QUAND"; else M="envoyée à TikTok"; fi
            python moteur/alerte.py "✅ Vidéo $M" "$FICHIER"
          else
            python moteur/alerte.py "❌ Publication échouée" "$FICHIER : voir la régie (Partage manuel possible)."
          fi

      - name: Enregistrer l'historique
        if: always()
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes
          git commit -m "Publication : $FICHIER" || echo "rien à enregistrer"
          REJOUER="python moteur/publier.py --marquer" MESSAGE="Historique mis à jour" python moteur/fusion.py

      - name: Reconstruire le site
        if: always()
        run: pip install -q pillow numpy opencv-python-headless && python moteur/site.py

      - name: Préparer GitHub Pages
        if: always()
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Envoyer le site
        if: always()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Mettre en ligne le site
        id: pages
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v5
