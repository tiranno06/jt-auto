name: Action de la régie

on:
  workflow_dispatch:
    inputs:
      action:
        description: "avis | legende | remarque"
        required: true
      fichier:
        required: true
      valeur:
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTION: ${{ inputs.action }}
      FICHIER: ${{ inputs.fichier }}
      VALEUR: ${{ inputs.valeur }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Appliquer
        run: python moteur/regie_action.py
      - name: Enregistrer l'historique
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes
          git commit -m "Régie : $ACTION sur $FICHIER" || echo "rien à enregistrer"
          REJOUER="python moteur/regie_action.py" MESSAGE="Régie : $ACTION" python moteur/fusion.py
      - name: Mettre le site à jour (une seule file d'attente pour tout le robot, aucune vidéo oubliée)
        if: always()
        run: |
          gh workflow run site.yml --ref main || echo "Mise à jour du site impossible à lancer : relancez « Mettre à jour le site »"
