name: Mettre à jour le site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["moteur/site.py"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                   # une seule mise en ligne à la fois ; la demande en attente la plus récente passe ensuite
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      NOM_EMISSION: ${{ vars.NOM_EMISSION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main                # toujours le dernier historique (même si la mise à jour a attendu son tour)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et Pillow
        timeout-minutes: 10
        run: |
          if ! (timeout 240 sudo apt-get update -q && timeout 240 sudo apt-get install -y -q ffmpeg); then
            echo "apt indisponible : ffmpeg statique"
            curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1
          pip install pillow numpy opencv-python-headless
      - name: Versions légères des vidéos (gardées d'une mise à jour à l'autre)
        uses: actions/cache@v6
        with:
          path: .cache_site
          key: site-legeres-${{ github.run_id }}
          restore-keys: site-legeres-
      - name: Construire le site
        run: python moteur/site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Mettre en ligne le site
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deuxième essai de mise en ligne
        if: steps.pages.outcome == 'failure'
        run: sleep 45
      - name: Mettre en ligne le site (2e essai)
        if: steps.pages.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Vérifier que la dernière vidéo est bien en ligne
        id: verif
        continue-on-error: true
        run: python moteur/verif_site.py "${{ steps.pages.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
      - name: Nouvelle mise en ligne (la vidéo n'était pas visible)
        if: steps.verif.outcome == 'failure'
        id: pages3
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Vérifier encore
        if: steps.verif.outcome == 'failure'
        id: verif2
        continue-on-error: true
        run: python moteur/verif_site.py "${{ steps.pages.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
      - name: Prévenir le téléphone (site pas à jour)
        if: steps.verif.outcome == 'failure' && steps.verif2.outcome == 'failure'
        env:
          VAPID_PRIVEE: ${{ vars.VAPID_PRIVEE }}
          VAPID_PUBLIQUE: ${{ vars.VAPID_PUBLIQUE }}
          PUSH_ABONNEMENTS: ${{ vars.PUSH_ABONNEMENTS }}
        run: |
          pip install -q cryptography
          python moteur/alerte.py "⚠️ Site pas à jour" "La dernière vidéo n'apparaît pas sur le site malgré deux mises en ligne. Elle est quand même visible dans l'appli (lue depuis les archives)." || true
          exit 1
