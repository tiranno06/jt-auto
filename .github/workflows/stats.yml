name: Statistiques TikTok

on:
  schedule:
    - cron: "23 5 * * *"        # chaque matin : vues, j'aime, commentaires, partages de la chaîne
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historique
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIKTOK_COMPTE: ${{ vars.TIKTOK_COMPTE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les statistiques publiques de la chaîne
        run: |
          pip install -q -U yt-dlp
          python moteur/stats.py | tee episodes/stats.txt
      - name: Enregistrer
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes
          git commit -m "Statistiques TikTok" || echo "rien à enregistrer"
          python moteur/fusion.py
