name: Statistiques TikTok

on:
  schedule:
    - cron: "23 * * * *"        # toutes les heures : vues, j'aime, commentaires, partages de la chaîne (l'appli se met à jour seule)
  workflow_dispatch:
    inputs:
      pseudos:
        description: "Facultatif : pseudos à tester, séparés par des virgules (sont-ils déjà pris ?)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write               # paliers d'abonnés : la vidéo « merci » est lancée (moteur/paliers.py)

concurrency:
  group: historique
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TIKTOK_COMPTE: ${{ vars.TIKTOK_COMPTE }}
      PSEUDOS: ${{ inputs.pseudos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lire les statistiques publiques de la chaîne
        run: |
          pip install -q -U yt-dlp
          python -u moteur/stats.py 2>&1 | tee episodes/stats.txt
      - name: Paliers d'abonnés fêtés (vidéo « merci » à 500, 1 000, 2 000… abonnés)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PALIERS: ${{ vars.PALIERS }}
          VAPID_PRIVEE: ${{ vars.VAPID_PRIVEE }}
          VAPID_PUBLIQUE: ${{ vars.VAPID_PUBLIQUE }}
          PUSH_ABONNEMENTS: ${{ vars.PUSH_ABONNEMENTS }}
        run: |
          pip install -q cryptography -c contraintes.txt || true
          python moteur/paliers.py
      - name: Enregistrer
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes
          git commit -m "Statistiques TikTok" || echo "rien à enregistrer"
          python moteur/fusion.py
