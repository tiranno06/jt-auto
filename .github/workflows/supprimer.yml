name: Supprimer une vidéo

# Lancé par la croix ✕ d'une vidéo dans la régie (après confirmation).
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Nom de la vidéo à supprimer (ex. 2026-10-10_11h59_emission.mp4)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  supprimer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      FICHIER: ${{ inputs.fichier }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        run: sudo apt-get install -y -q ffmpeg || true
      - name: Supprimer
        run: python moteur/supprimer.py
      - name: Enregistrer l'historique
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes
          git commit -m "Suppression : $FICHIER" || echo "rien à enregistrer"
          REJOUER="python moteur/supprimer.py" MESSAGE="Historique mis à jour" python moteur/fusion.py
      - name: Reconstruire le site
        run: pip install -q pillow numpy opencv-python-headless && python moteur/site.py
      - name: Préparer GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Envoyer le site
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Mettre en ligne le site
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v5
