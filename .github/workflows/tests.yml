name: Tests

on:                                   # avant chaque mise à jour du robot : chaque demande de fusion et chaque envoi sur main
  push:
    branches: [main]
    paths: ["moteur/**", "tests/**"]
  pull_request:
    paths: ["moteur/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: pip install -q -r requirements.txt && sudo apt-get install -y -qq ffmpeg rubberband-cli >/dev/null
      - name: Lancer les tests
        run: python -m unittest discover -s tests -v
