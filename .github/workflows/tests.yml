name: Tests

on:
  push:
    branches: [main]
    paths: ["moteur/**", "tests/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: pip install -q numpy opencv-python-headless pillow scipy
      - name: Lancer les tests
        run: python -m unittest discover -s tests -v
