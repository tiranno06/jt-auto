name: Tests

on:
  push:
    branches: [main]
    paths: ["moteur/**", "tests/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bibliothèques
        run: pip install -q numpy opencv-python-headless pillow scipy
      - name: Lancer les tests
        run: python -m unittest discover -s tests -v
