name: Vérifier Buffer

on:
  workflow_dispatch:
    inputs:
      envois:
        description: "Facultatif : numéros d'envois Buffer à examiner (séparés par des espaces)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Comptes connectés à Buffer (rien n'est publié)
        run: (python moteur/publier.py --canaux; python moteur/publier.py --schema) 2>&1 | tee episodes/buffer.txt
      - name: État réel des envois et du compte TikTok
        continue-on-error: true
        run: python moteur/publier.py --diagnostic ${{ inputs.envois }}
      - name: Enregistrer
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "robot-jt"
          git config user.email "robot-jt@users.noreply.github.com"
          git add episodes/buffer.txt
          git commit -m "Vérification Buffer" || echo "rien à enregistrer"
          python moteur/fusion.py
